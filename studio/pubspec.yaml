name: tex_math_studio
description: macOS Flutter comparison workbench comparing tex_math against MathJax and KaTeX output across TeX math expressions.
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  tex_math: ^0.1.0-dev
  tex_math_flutter: ^0.1.0-dev
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.27.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  uses-material-design: true
