name: Reference Release Monitor

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-reference:
    name: Check MathJax & JupyterLab Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.5"

      - name: Check npm registry for MathJax and JupyterLab updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dart tool/sync_reference.dart --check --json > reference_status.json
          cat reference_status.json

          HAS_UPDATE=$(jq -r '.hasUpdate' reference_status.json)
          PINNED_MATHJAX=$(jq -r '.pinnedMathjax' reference_status.json)
          LATEST_MATHJAX=$(jq -r '.latestMathjax' reference_status.json)
          PINNED_JUPYTERLAB=$(jq -r '.pinnedJupyterlab' reference_status.json)
          LATEST_JUPYTERLAB=$(jq -r '.latestJupyterlab' reference_status.json)

          if [ "$HAS_UPDATE" != "true" ]; then
            echo "Reference pins match upstream releases (mathjax=$PINNED_MATHJAX, jupyterlab=$PINNED_JUPYTERLAB)."
            exit 0
          fi

          ISSUE_TITLE="chore(reference): sync mathjax ${LATEST_MATHJAX} / jupyterlab ${LATEST_JUPYTERLAB}"
          EXISTING_COUNT=$(gh issue list --state open --search "\"${ISSUE_TITLE}\" in:title" --json number --jq 'length')

          if [ "$EXISTING_COUNT" != "0" ]; then
            echo "Open tracking issue for ${ISSUE_TITLE} already exists; skipping duplicate creation."
            exit 0
          fi

          {
            echo "## Reference Update Detected"
            echo ""
            echo "| Package | Pinned | Latest |"
            echo "| :--- | :--- | :--- |"
            echo "| \`mathjax\` | \`${PINNED_MATHJAX}\` | \`${LATEST_MATHJAX}\` |"
            echo "| \`@jupyterlab/mathjax-extension\` | \`${PINNED_JUPYTERLAB}\` | \`${LATEST_JUPYTERLAB}\` |"
            echo ""
            echo "### Sync Instructions"
            echo ""
            echo "Follow [\`doc/REFERENCE_SYNC.md\`](doc/REFERENCE_SYNC.md) and [\`.agents/skills/sync-reference-mathjax/SKILL.md\`](.agents/skills/sync-reference-mathjax/SKILL.md) to update \`tool/oracle/package.json\`, regenerate \`tool/oracle/package-lock.json\`, refresh \`REFERENCE.md\`, and verify the full corpus and benchmark suites."
          } > issue_body.md

          gh issue create \
            --title "$ISSUE_TITLE" \
            --label "enhancement" \
            --body-file issue_body.md
