name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Analyze, Test & Oracle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter & Dart SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tool/oracle/package-lock.json

      - name: Install Dart & Flutter workspace dependencies
        run: flutter pub get

      - name: Install MathJax oracle dependencies
        working-directory: tool/oracle
        run: npm ci

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed packages tool studio

      - name: Run static analysis
        run: dart analyze --fatal-infos

      - name: Run pure-Dart core tests & CLI example
        working-directory: packages/tex_math
        run: |
          dart test
          dart run example/main.dart

      - name: Run pure-Dart dartdoc check (release tags)
        if: github.ref_type == 'tag'
        working-directory: packages/tex_math
        run: dart doc --dry-run

      - name: Run Flutter package tests
        working-directory: packages/tex_math_flutter
        run: flutter test

      - name: Run Flutter package dartdoc check (release tags)
        if: github.ref_type == 'tag'
        working-directory: packages/tex_math_flutter
        run: dart doc --dry-run

      - name: Run Flutter example app tests
        working-directory: packages/tex_math_flutter/example
        run: flutter test

      - name: Run Studio app tests
        working-directory: studio
        run: flutter test

      - name: Verify lockstep versions
        run: dart run tool/check_versions.dart

      - name: Verify release git tag matches lockstep version
        if: github.ref_type == 'tag'
        run: dart run tool/check_versions.dart --tag "${GITHUB_REF_NAME}"

      - name: Verify corpus against MathJax 4.1.3 oracle
        run: dart run tool/verify_against_mathjax.dart

      - name: Verify REFERENCE.md pins and oracle lockfile hash
        run: dart run tool/sync_reference.dart --verify

      - name: Verify generated documentation SVGs
        run: dart run tool/generate_doc_images.dart --check

      - name: Validate pub.dev publish readiness for tex_math
        if: github.ref_type == 'tag'
        working-directory: packages/tex_math
        run: dart pub publish --dry-run

      - name: Validate pub.dev publish readiness for tex_math_flutter
        if: github.ref_type == 'tag'
        working-directory: packages/tex_math_flutter
        run: flutter pub publish --dry-run
