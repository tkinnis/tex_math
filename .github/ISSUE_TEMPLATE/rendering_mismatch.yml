name: Rendering Mismatch
description: Report a layout, spacing, glyph, or error-handling mismatch between tex_math and MathJax 4.1.3.
title: "[Rendering]: "
labels: ["rendering"]
body:
  - type: markdown
    attributes:
      value: |
        `tex_math` targets layout, glyph, and error parity with pinned **MathJax `4.1.3`** (`NewCMMath-Regular.otf`). Providing the TeX input alongside screenshots from both MathJax and `tex_math` helps diagnose metric or grammar differences quickly.

  - type: dropdown
    id: display_mode
    attributes:
      label: Display Mode
      options:
        - display
        - inline
    validations:
      required: true

  - type: input
    id: packages_used
    attributes:
      label: TeX Packages / Tier
      description: "List the MathJax TeX packages used (e.g., base, ams, mathtools, mhchem, physics)."
      placeholder: "base, ams"
    validations:
      required: false

  - type: textarea
    id: tex_source
    attributes:
      label: TeX Source
      description: Paste the exact TeX expression that exhibits the rendering mismatch.
      render: tex
      placeholder: |
        \int_{-\infty}^{\infty} e^{-x^2}\,dx = \sqrt{\pi}
    validations:
      required: true

  - type: textarea
    id: mathjax_screenshot
    attributes:
      label: MathJax Screenshot
      description: Attach or drag-and-drop a screenshot showing the MathJax 4.1.3 rendering (from the `studio/` workbench or MathJax oracle output).
    validations:
      required: true

  - type: textarea
    id: tex_math_screenshot
    attributes:
      label: tex_math Screenshot
      description: Attach or drag-and-drop a screenshot showing the `tex_math` / `tex_math_flutter` rendering (from the `studio/` workbench or your Flutter app).
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Observed Difference & Environment
      description: Describe the spacing, box metrics, delimiter sizing, or glyph mismatch, along with your platform and SDK versions.
    validations:
      required: false
