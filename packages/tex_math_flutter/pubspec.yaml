name: tex_math_flutter
description: Flutter widget, theming, bundled New Computer Modern Math font asset, and background isolate layout integration for tex_math.
version: 0.1.0
homepage: https://tkinnis.github.io/tex_math/
repository: https://github.com/tkinnis/tex_math/tree/main/packages/tex_math_flutter
issue_tracker: https://github.com/tkinnis/tex_math/issues
documentation: https://tkinnis.github.io/tex_math/

topics:
  - tex
  - latex
  - math
  - widget
  - typography

screenshots:
  - description: 'TexMath widget rendering the quadratic formula using bundled OpenType MATH paths.'
    path: screenshots/formula_quadratic.png
  - description: 'Dark-theme TexMath widget styled dynamically via TexMathTheme without relayout.'
    path: screenshots/dark_theme_formula.png
  - description: 'Parenthesized rotation matrix rendered with cached glyph paths in TexMath.'
    path: screenshots/formula_matrix.png

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  tex_math: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  assets:
    - assets/fonts/NewCMMath-Regular.otf
    - assets/fonts/GUST-FONT-LICENSE.txt
    - assets/fonts/MANIFEST-NewCMMath.txt
