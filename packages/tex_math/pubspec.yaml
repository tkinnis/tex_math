name: tex_math
description: Pure-Dart TeX math-mode parser, OpenType MATH layout engine, and SVG/MathML/spoken-text renderer aligned to MathJax TeX input.
version: 0.1.0
homepage: https://tkinnis.github.io/tex_math/
repository: https://github.com/tkinnis/tex_math/tree/main/packages/tex_math
issue_tracker: https://github.com/tkinnis/tex_math/issues
documentation: https://tkinnis.github.io/tex_math/

topics:
  - tex
  - latex
  - math
  - svg
  - opentype

screenshots:
  - description: 'Quadratic formula laid out with OpenType MATH metrics and vector paths.'
    path: screenshots/formula_quadratic.png
  - description: 'Rotation matrix with extensible delimiters and trigonometric operators.'
    path: screenshots/formula_matrix.png

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  meta: ^1.19.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
